{% extends "base.html" %}
{% block title %}Corriger — Pronotedz{% endblock %}
{% block page_title %}<h1 class="h4 mb-0">Corriger — {{ rendu.eleve.user.get_full_name }}</h1>{% endblock %}

{% block content %}
  <p><a href="{{ rendu.fichier.url }}" class="btn btn-sm btn-outline-secondary">Télécharger le fichier déposé</a></p>

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Note /20</label>
      <input type="number" step="0.5" min="0" max="20" name="note_sur_20" class="form-control w-auto" value="{{ rendu.note_sur_20|default:'' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Commentaire / annotation</label>
      <textarea name="commentaire_correction" class="form-control" rows="4">{{ rendu.commentaire_correction }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer la correction</button>
  </form>
{% endblock %}
