{% if publications %}
  <h2 class="h6 mt-4">Actualités</h2>
  {% for publication in publications %}
    <div class="card mb-2">
      <div class="card-body py-2">
        <div class="fw-semibold">{% if publication.epingle %}📌 {% endif %}{{ publication.titre }}</div>
        <div class="small">{{ publication.contenu|truncatewords:25 }}</div>
      </div>
    </div>
  {% endfor %}
  <p><a href="{% url 'actualites:liste' %}" class="small">Voir toutes les actualités</a></p>
{% endif %}
