{% extends "base.html" %}
{% block title %}Nouvelle observation — Pronotedz{% endblock %}
{% block page_title %}<h1 class="h4 mb-0">Nouvelle observation</h1>{% endblock %}

{% block content %}
  {% if classes|length > 1 %}
    <div class="mb-3">
      <select class="form-select form-select-sm w-auto" onchange="window.location='?classe='+this.value">
        {% for c in classes %}
          <option value="{{ c.pk }}" {% if c == classe %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="classe" value="{{ classe.pk }}">
    <div class="mb-3">
      <label class="form-label">Élève</label>
      <select name="eleve" class="form-select" required>
        {% for eleve in eleves %}
          <option value="{{ eleve.pk }}">{{ eleve.user.get_full_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Type</label>
      <select name="type_observation" class="form-select" required>
        {% for value, label in types %}
          <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Date</label>
      <input type="date" name="date" class="form-control w-auto" value="{{ today|date:'Y-m-d' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Motif</label>
      <input type="text" name="motif" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Description (optionnel)</label>
      <textarea name="description" class="form-control" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
  </form>
{% endblock %}
