# ═══════════════════════════════════════════════════════════════════════
#  Le fichier que je toucherai le plus souvent.
#  C'est ici que se pilote tout l'arbitrage qualité / coût.
#  Ajouter un modèle = ajouter une entrée. Zéro ligne de Python.
# ═══════════════════════════════════════════════════════════════════════

# ⚠️ Les prix bougent tous les 2-3 mois. À revérifier avant de s'y fier.
#    Ils servent au calcul du coût et aux garde-fous de budget.
#    Unité : euros par million de jetons (texte), par image, par 1000 caractères.

fournisseurs:
  anthropic:
    cle: anthropic_api_key
    base_url: https://api.anthropic.com/v1
  fal:
    cle: fal_key
    base_url: https://fal.run
  elevenlabs:
    cle: elevenlabs_api_key
    base_url: https://api.elevenlabs.io/v1
  # SkyReels — animation. L'adresse exacte de l'API est à confirmer dans leur
  # documentation avant usage ; elle n'a pas pu être vérifiée ici.
  skyreels:
    cle: skyreels_api_key
    base_url: https://api.skyreels.ai/v1
    a_verifier: true
  # AudD — reconnaissance musicale. 300 requêtes offertes, puis ~5 $/1000.
  audd:
    cle: audd_api_key
    base_url: https://api.audd.io
  groq:
    cle: groq_api_key
    base_url: https://api.groq.com/openai/v1
    compatible_openai: true
  # Pollinations.ai — images gratuites, sans clé ni carte bancaire. Le module
  # pdz/ia/pollinations.py n'appelle jamais `cle_fournisseur()` pour ce
  # fournisseur : cette entrée est là pour la documentation, pas pour être lue.
  pollinations:
    base_url: https://image.pollinations.ai

modeles:
  # ── Texte ────────────────────────────────────────────────────────────
  - id: claude-sonnet-5
    fournisseur: anthropic
    fait: [ecriture, analyse, critique, vision]
    contexte: 200000
    prix: { entree_par_million: 2.76, sortie_par_million: 13.80 }
    # Anthropic facture la lecture de cache 10 % de l'entrée, l'écriture 125 %.
    cache: { lecture: 0.10, ecriture: 1.25 }
    sorties_structurees: true

  - id: claude-haiku-4-5-20251001
    fournisseur: anthropic
    fait: [ecriture_rapide, vision, controle]
    contexte: 200000
    prix: { entree_par_million: 0.92, sortie_par_million: 4.60 }
    cache: { lecture: 0.10, ecriture: 1.25 }
    sorties_structurees: true

  # Remplace `llama-3.3-70b-versatile`, qui vivait ici et servait TOUTE
  # l'écriture. Groq l'a déprécié le 17/06/2026 puis coupé : mesuré en
  # production le 18/08/2026, l'épisode échouait en 2 s sur « Modèle Groq
  # introuvable » (404) AVANT le premier appel. Une `ErreurConfig` a
  # `repli_modele=False` (voir pdz/moteur/erreurs.py) : un identifiant
  # périmé n'est PAS rattrapé par un repli, il arrête la production net —
  # d'où l'importance de garder ce champ juste.
  # Groq recommande deux remplaçants : celui-ci et `qwen/qwen3.6-27b`.
  # C'est celui-ci qui convient, et pas seulement parce qu'il est plus
  # gros (120 B contre 70 B) : il est SANS VISION, donc il occupe
  # exactement la même place que le modèle retiré. Mesuré en essayant
  # l'autre : donner écriture ET vision au même modèle désactive toute la
  # substitution de capacité de `registre.resoudre()` (elle ne se
  # déclenche que si le modèle résolu ne sait PAS faire) — la vision
  # cessait de repasser chez Claude quand une clé Anthropic est là, et
  # l'erreur « aucun modèle capable » ne se levait plus. Deux garanties
  # perdues d'un coup, pour un modèle plus petit.
  - id: openai/gpt-oss-120b
    fournisseur: groq
    fait: [ecriture, critique]
    contexte: 131000
    prix: { entree_par_million: 0.0, sortie_par_million: 0.0 }
    sorties_structurees: true

  # Le seul modèle GRATUIT capable de VISION : c'est lui qui permet à
  # `charte` (lire le style d'une vidéo de référence) et à `qa_image`
  # (vérifier une image produite) de tourner sans crédit Anthropic. Déclaré
  # avant les modèles Anthropic pour rien — l'ordre ne compte que entre
  # modèles d'une même capacité, et `_capable()` prend le premier qui sait
  # faire ET dont la clé est là.
  # ⚠️ Remplace `meta-llama/llama-4-maverick-17b-128e-instruct`, retiré par
  # Groq (404 mesuré en production le 13/08/2026 — la ligne juste au-dessus,
  # écrite avant ce retrait, prédisait déjà ce jour). Limite réelle : 5
  # images par requête au maximum (l'analyse en extrait 6, la dernière est
  # écartée). Si CE modèle disparaît à son tour, `pdz cles` et l'erreur de
  # `charte`/`qa_image` le diront clairement — c'est le même filet qui a
  # permis de repérer le retrait précédent aussi vite.
  # Reste VOLONTAIREMENT limité à la vision et à l'analyse, même s'il sait
  # écrire : lui confier aussi l'écriture ferait de lui le modèle résolu
  # pour l'alias `qualite`, et comme il fait déjà la vision, la
  # substitution de capacité ne se déclencherait plus jamais (voir le
  # commentaire de `openai/gpt-oss-120b` ci-dessus). Un modèle qui sait
  # tout faire supprime le mécanisme même qui sert à choisir le meilleur.
  - id: qwen/qwen3.6-27b
    fournisseur: groq
    fait: [vision, analyse]
    contexte: 128000
    prix: { entree_par_million: 0.0, sortie_par_million: 0.0 }
    sorties_structurees: true

  # Alternative GRATUITE à fal.ai, pour illustrer sans carte bancaire. Sert
  # le profil « gratuit ». Contrepartie : pas d'image de référence en entrée,
  # donc les personnages sont moins constants d'un plan à l'autre qu'avec
  # fal.ai — voir pdz/ia/pollinations.py et pdz/production/images.py.
  # ⚠️ Non vérifiable depuis l'environnement de développement, comme fal.ai
  # et Groq — à confirmer sur la machine de l'utilisateur.
  - id: pollinations/flux
    fournisseur: pollinations
    fait: [images]
    prix: { par_image: 0.0 }

  # ── Images ───────────────────────────────────────────────────────────
  - id: fal-ai/flux/schnell
    fournisseur: fal
    fait: [images]
    prix: { par_image: 0.0028 }
    options: [seed, image_reference]

  - id: fal-ai/flux/dev
    fournisseur: fal
    fait: [images]
    prix: { par_image: 0.023 }        # ~8× le prix, nettement plus fin
    options: [seed, image_reference]

  # ── Animation (image → vidéo) ────────────────────────────────────────
  # Le poste le plus cher du système. Voir docs/12-videos-a-personnages.md.
  # ⚠️ L'identifiant doit correspondre EXACTEMENT à un endpoint publié par
  # fal.ai. `v2/standard/image-to-video` n'existe pas — il a été mesuré en
  # conditions réelles comme produisant des épisodes sans aucune animation :
  # la soumission partait en 404, et l'échec était rattrapé en image fixe.
  # Versions réellement publiées : v1/standard, v2.1/standard, v2.1/pro,
  # v2.1/master, v2.6/pro.
  # Modèle d'animation par défaut. Plus cher que ltx-video (~2,5×), mais
  # c'est le seul des deux à dépasser 5 s — et c'est CE plafond, pas la
  # qualité du mouvement, qui bloquait la production : mesuré sur l'épisode
  # #74, 5 plans sur 6 (5,9 à 7,1 s) n'atteignaient jamais le modèle vidéo et
  # repartaient en parallaxe mécanique. Le seul plan réellement animé, lui,
  # mesurait 18,4/255 de mouvement inter-frame contre 1,6 à 6,2 pour les
  # replis. Le goulot était la durée, pas le prompt.
  # ⚠️ L'identifiant doit correspondre EXACTEMENT à un endpoint publié par
  # fal.ai. `v2/standard/image-to-video` n'existe pas — il a été mesuré en
  # conditions réelles comme produisant des épisodes sans aucune animation :
  # la soumission partait en 404, et l'échec était rattrapé en image fixe.
  # Versions réellement publiées : v1/standard, v2.1/standard, v2.1/pro,
  # v2.1/master, v2.6/pro.
  - id: fal-ai/kling-video/v2.1/standard/image-to-video
    fournisseur: fal
    fait: [animation]
    prix: { par_seconde: 0.046 }
    options: [image_depart, duree]
    # Les deux seules valeurs que le endpoint accepte. ANNONCÉES par fal, pas
    # encore mesurées ici — contrairement au 5 de ltx-video ci-dessous, qui
    # l'est. Si le 10 s ne tient pas ses promesses, rien ne casse : la
    # vérification de durée dans `animation.animer()` rejette le clip et le
    # plan repart en repli local, comme aujourd'hui.
    durees_s: [5, 10]

  # Repli d'animation : ~61 % moins cher, mais plafonné à 5 s.
  - id: fal-ai/ltx-video-v097/image-to-video
    fournisseur: fal
    fait: [animation]
    prix: { par_seconde: 0.018 }
    options: [image_depart, duree]
    # MESURÉ (enquêtes runs #57, #65, #66) : ce endpoint rend ~4,84 s qu'on
    # lui demande 5 ou 10 — le paramètre `duration` n'a aucun effet au-delà.
    # Un seul palier réel, donc, et c'est bien 5 et pas 10.
    durees_s: [5]

  # ── Voix ─────────────────────────────────────────────────────────────
  - id: eleven_turbo_v2_5
    fournisseur: elevenlabs
    fait: [voix]
    prix: { par_1000_caracteres: 0.0 }   # inclus dans l'abonnement mensuel
    options: [voice_id, stabilite, style]

  # ── Reconnaissance de musique ────────────────────────────────────────
  - id: audd/recognize
    fournisseur: audd
    fait: [reconnaissance_musique]
    prix: { par_image: 0.0046 }        # facturé à la requête, pas au temps

  # ── Transcription (analyse de vidéos) ────────────────────────────────
  - id: whisper-large-v3-turbo
    fournisseur: groq
    fait: [transcription]
    prix: { par_heure_audio: 0.037 }


# ═══════════════════════════════════════════════════════════════════════
#  LES ALIAS — c'est ICI que je pilote la qualité et le coût.
#  Les agents ne demandent jamais un modèle, ils demandent un alias.
#
#  ⚠️ TEMPORAIRE, sur demande explicite : Anthropic retiré des alias texte.
#  Avant ce changement, « équilibre »/« premium » visaient Claude et
#  retombaient sur Llama seulement si ANTHROPIC_API_KEY manquait
#  (`repli_si_cle_absente`, voir pdz/ia/registre.py) — c'est ce chemin qui
#  a produit le script trop court avec Llama sur le dernier run. En
#  pointant l'alias directement sur Llama, tous les profils texte
#  (economique/equilibre/premium compris) utilisent Groq sans jamais
#  tenter Anthropic ni dépendre de son repli. Pour restaurer : remettre
#  claude-sonnet-5 / claude-haiku-4-5-20251001 ci-dessous (et dans
#  `economique` sous profils, plus bas).
# ═══════════════════════════════════════════════════════════════════════
alias:
  qualite:    { principal: openai/gpt-oss-120b }
  critique:   { principal: openai/gpt-oss-120b,    temperature: 0.2 }
  rapide:     { principal: openai/gpt-oss-120b }
  vision:     { principal: qwen/qwen3.6-27b }
  images:     { principal: fal-ai/flux/schnell,        repli: fal-ai/flux/dev }
  animation:  { principal: fal-ai/kling-video/v2.1/standard/image-to-video, repli: fal-ai/ltx-video-v097/image-to-video }
  voix:       { principal: eleven_turbo_v2_5 }
  transcription: { principal: whisper-large-v3-turbo }
  musique:       { principal: audd/recognize }


# ═══════════════════════════════════════════════════════════════════════
#  PROFILS — quatre réglages prêts à l'emploi.
#  `pdz episode ... --profil economique`
# ═══════════════════════════════════════════════════════════════════════
profils:
  economique:
    images: fal-ai/flux/schnell
    qualite: openai/gpt-oss-120b     # temporaire, voir la note sur les alias plus haut
    animer: false                       # aucune animation, images fixes animées
  equilibre:
    images: fal-ai/flux/schnell
    plans_animes_max: 6                 # on n'anime que les plans qui le méritent
  premium:
    images: fal-ai/flux/dev
    animation: fal-ai/kling-video/v2.1/standard/image-to-video
    plans_animes_max: 12
  # Zéro euro, aucune carte bancaire : Llama via Groq pour écrire, Pollinations
  # pour illustrer. Demande une clé GROQ_API_KEY (gratuite, sans carte, sur
  # console.groq.com) ; aucune clé pour les images. `pdz charte` fonctionne
  # aussi : le registre bascule tout seul sur le modèle Groq de vision quand
  # un agent envoie des images. Les personnages seront moins constants d'un
  # plan à l'autre qu'avec fal.ai — voir pdz/ia/pollinations.py.
  gratuit:
    qualite: openai/gpt-oss-120b
    critique: openai/gpt-oss-120b
    images: pollinations/flux
    animer: false
  # Écrit gratuitement avec Llama via Groq, comme « gratuit » — mais illustre
  # avec fal.ai, comme les profils payants, pour de meilleures images et une
  # constance des personnages digne de ce nom. Utile quand seul le crédit
  # Anthropic manque encore. Demande GROQ_API_KEY et FAL_KEY, pas
  # ANTHROPIC_API_KEY. Pas d'animation ici non plus — voir « equilibre » ou
  # « premium » une fois prêt à payer aussi l'écriture chez Claude.
  hybride:
    qualite: openai/gpt-oss-120b
    critique: openai/gpt-oss-120b
    images: fal-ai/flux/schnell
    animer: false


# ═══════════════════════════════════════════════════════════════════════
#  RÈGLES — appliquées dans l'ordre, la première qui correspond gagne.
# ═══════════════════════════════════════════════════════════════════════
regles:
  - si: { budget_restant_pourcent: "<20" }
    alors: { qualite: openai/gpt-oss-120b, images: fal-ai/flux/schnell, animer: false }  # temporaire, voir la note sur les alias plus haut
  - si: { budget_restant_pourcent: "<5" }
    alors: { stop: true }
