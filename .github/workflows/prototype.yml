# ═══════════════════════════════════════════════════════════════════════
#  Prototype — préparer une vidéo éducative, puis la monter.
#
#  Onglet « Actions » → « Prototype — vidéo éducative » → « Run workflow ».
#
#  ⚠️ CE SYSTÈME NE GÉNÈRE NI IMAGE NI VIDÉO, ET C'EST VOULU.
#
#  Il prépare tout — script, visual bible, prompts image et animation — puis
#  te rend la main. Tu produis avec l'outil de ton choix, tu déposes les
#  vidéos, et il analyse, cale la timeline, écrit les sous-titres et monte.
#
#  Huit étapes :
#
#    « texte »           → la narration SEULE : la vraie chaîne physique,
#                          trois ouvertures dont une gagne, le script, puis
#                          l'objection d'un ingénieur hostile sur chaque
#                          phrase. Elle est enchaînée dans « storyboard ».
#    « storyboard »      → le texte, puis visual bible, plans, prompts image ET
#                          animation, contrôle qualité, puis l'agent
#                          d'alignement repasse chaque plan un par un.
#    « aligner »         → repasser l'agent seul : pour chaque phrase, trois
#                          actions possibles, la meilleure gagne, les deux
#                          prompts sont réécrits autour d'elle.
#    « affiner-tout »    → tes IMAGES → chaque prompt d'animation réécrit sur
#                          l'image réelle, et non plus sur une image imaginée.
#    « analyser-videos » → les vidéos que TU as déposées → ce qu'elles
#                          montrent vraiment, défauts compris, et le verdict :
#                          quels plans sont à refaire.
#    « controle »        → le même verdict, sans réanalyser (aucun appel).
#    « juger »           → LE contrôle qui ne se ment pas : un modèle qui ne
#                          sait rien regarde les vidéos SANS la narration et
#                          dit ce qu'il a compris. On compare à ce que le plan
#                          devait faire comprendre. Les plans compris entrent
#                          dans la mémoire et serviront aux vidéos suivantes.
#    « montage »         → timeline calée sur la voix, sous-titres, MP4.
#
#  SANS CRÉDIT OPENAI, deux étapes de plus — les mêmes prompts, à la main :
#
#    « manuel »          → écrit le prompt EXACT de l'étape choisie dans
#                          app/output/manuel/. Tu le copies (GitHub pose un
#                          bouton « copier » sur le bloc), tu le colles dans
#                          ChatGPT. Aucun appel, aucune clé, 0 €.
#    « coller »          → tu déposes la réponse de ChatGPT dans
#                          app/output/manuel/reponse.json, et elle passe LES
#                          MÊMES contrôles, hors ligne. Ce qui cloche revient
#                          en un bloc à recoller dans la même conversation.
#
#  Le storyboard n'est jamais accepté sur parole : validator.py le vérifie,
#  et ce qui échoue repart chez OpenAI pour correction.
# ═══════════════════════════════════════════════════════════════════════

name: Prototype — vidéo éducative

on:
  workflow_dispatch:
    inputs:
      etape:
        description: "Ce que je veux faire"
        required: true
        default: storyboard
        type: choice
        options:
          - storyboard
          - texte
          - aligner
          - affiner-tout
          - analyser-videos
          - controle
          - mesurer-videos
          - voix
          - juger
          - montage
          - manuel
          - coller
      sujet:
        description: "Le sujet de la vidéo"
        required: false
        default: "Fonctionnement d'une voiture électrique"
        type: string
      duree:
        description: "Durée visée, en secondes"
        required: false
        default: "16"
        type: string
      plans:
        description: >-
          Nombre de plans. Le defaut est 20 ; 4, 6, 8, 10 ou 15 marchent aussi.
          Le nombre est une contrainte, jamais un but : aucun plan n'existe
          pour atteindre le compte.
        required: false
        default: "20"
        type: string
      manuel_etape:
        description: >-
          Pour « manuel » et « coller » : de quelle étape il s'agit. « aligner »
          se fait un plan à la fois — donne son numéro dans « plan ».
        required: false
        default: texte
        type: choice
        options:
          - texte
          - storyboard
          - aligner
      plan:
        description: >-
          Pour « manuel »/« coller » en mode « aligner » : le numéro du plan.
          0 = tous (à l'écriture des prompts seulement).
        required: false
        default: "0"
        type: string
      style:
        description: >-
          Remplace la phrase de direction artistique. Le défaut ne nomme aucun
          sujet — vraie caméra macro, matériaux justes, noir profond, filaments
          lumineux retenus — et tient donc sur n'importe quel sujet. Laisse vide
          pour le garder.
        required: false
        default: ""
        type: string
      enregistrer:
        description: >-
          Enregistrer le storyboard et la feuille d'éléments dans la branche,
          pour les relire depuis un téléphone.
        required: false
        default: true
        type: boolean

jobs:
  video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: prototype

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r app/requirements.txt

      - name: Installer ffmpeg
        if: inputs.etape == 'analyser-videos' || inputs.etape == 'montage'
            || inputs.etape == 'juger' || inputs.etape == 'mesurer-videos'
            || inputs.etape == 'voix'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Vérifier qu'un cerveau est disponible
        if: inputs.etape != 'controle' && inputs.etape != 'manuel'
            && inputs.etape != 'coller' && inputs.etape != 'mesurer-videos'
            && inputs.etape != 'voix'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY présente (${#OPENAI_API_KEY} caractères) → OpenAI."
          elif [ -n "$GROQ_API_KEY" ]; then
            echo "OPENAI_API_KEY absente, GROQ_API_KEY présente → bascule sur Groq."
            echo "::warning::Pour analyser des vidéos, nomme un modèle vision Groq via"
            echo "la variable OPENAI_VISION_MODEL, sinon l'analyse échouera."
          else
            echo "::error::Aucun cerveau : ni OPENAI_API_KEY ni GROQ_API_KEY."
            echo "Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Script, storyboard, visual bible et prompts
        if: inputs.etape == 'storyboard'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STYLE_DIRECTIVE: ${{ inputs.style }}
        run: |
          python -m app.main storyboard \
            --subject "${{ inputs.sujet }}" \
            --duration "${{ inputs.duree }}" \
            --shots "${{ inputs.plans }}"

      - name: La narration seule, écrite et vérifiée
        if: inputs.etape == 'texte'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m app.main texte \
            --subject "${{ inputs.sujet }}" \
            --duration "${{ inputs.duree }}" \
            --shots "${{ inputs.plans }}"

      - name: L'agent d'alignement, plan par plan
        if: inputs.etape == 'aligner'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STYLE_DIRECTIVE: ${{ inputs.style }}
        run: python -m app.main aligner

      - name: Réécrire les animations sur les images réelles
        if: inputs.etape == 'affiner-tout'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || '' }}
        run: |
          if [ ! -d app/output/images ]; then
            echo "::error::app/output/images absent."
            echo "Dépose tes images (shot_01.png, shot_02.png, …) dans ce dossier,"
            echo "commite-les dans la branche, puis relance cette étape."
            exit 1
          fi
          python -m app.main affiner-tout

      - name: Le juge aveugle, et ce qu'il laisse à la mémoire
        if: inputs.etape == 'juger'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || '' }}
        run: |
          if [ ! -d app/output/videos ]; then
            echo "::error::app/output/videos absent."
            echo "Dépose tes vidéos, commite-les, puis relance cette étape."
            exit 1
          fi
          python -m app.main juger

      - name: Installer espeak-ng
        if: inputs.etape == 'voix' || inputs.etape == 'montage'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng

      - name: La durée de chaque phrase — espeak, ou ta vraie voix
        if: inputs.etape == 'voix'
        run: |
          # Une vraie piste déposée dans app/output/voix.mp3 gagne toujours :
          # espeak ne sert que tant qu'elle n'existe pas.
          if [ -f app/output/voix.mp3 ]; then
            python -m app.main voix --sur app/output/voix.mp3 --caler
          else
            python -m app.main voix --caler
          fi

      - name: Mesurer les vidéos rendues — format, durée, couleurs
        if: inputs.etape == 'mesurer-videos'
        run: |
          if [ ! -d app/output/videos ]; then
            echo "::error::app/output/videos absent."
            echo "Dépose tes vidéos (shot_01.mp4, shot_03.mp4, …), commite-les,"
            echo "puis relance cette étape. Aucune clé n'est nécessaire."
            exit 1
          fi
          python -m app.main mesurer-videos

      - name: Le verdict sur les vidéos, sans rien réanalyser
        if: inputs.etape == 'controle'
        run: python -m app.main controle || true

      - name: Analyser les vidéos déposées
        if: inputs.etape == 'analyser-videos'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || '' }}
        run: |
          if [ ! -d app/output/videos ]; then
            echo "::error::app/output/videos absent."
            echo "Dépose tes vidéos (shot_01.mp4, shot_02.mp4, …) dans ce dossier,"
            echo "commite-les dans la branche, puis relance cette étape."
            exit 1
          fi
          python -m app.main analyser-videos

      - name: Le prompt à coller dans ChatGPT
        if: inputs.etape == 'manuel'
        env:
          STYLE_DIRECTIVE: ${{ inputs.style }}
        run: |
          python -m app.main manuel \
            --etape "${{ inputs.manuel_etape }}" \
            --shot "${{ inputs.plan }}" \
            --subject "${{ inputs.sujet }}" \
            --duration "${{ inputs.duree }}" \
            --shots "${{ inputs.plans }}"

      - name: La réponse de ChatGPT, contrôlée hors ligne
        if: inputs.etape == 'coller'
        env:
          STYLE_DIRECTIVE: ${{ inputs.style }}
        run: |
          if [ ! -f app/output/manuel/reponse.json ]; then
            echo "::error::app/output/manuel/reponse.json est absent."
            echo "Colle la réponse de ChatGPT dans ce fichier (GitHub : Add file →"
            echo "Create new file), commite-la dans la branche, puis relance."
            exit 1
          fi
          python -m app.main coller \
            --etape "${{ inputs.manuel_etape }}" \
            --shot "${{ inputs.plan }}" \
            --subject "${{ inputs.sujet }}" \
            --duration "${{ inputs.duree }}" \
            --shots "${{ inputs.plans }}"

      - name: Timeline, sous-titres et montage
        if: inputs.etape == 'montage'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m app.main montage --partiel --reperage

      - name: Récapitulatif lisible en fin de page
        if: always()
        run: |
          {
            echo "## Prototype — étape \`${{ inputs.etape }}\`"
            echo
            for fiche in app/output/manuel/*.md; do
              [ -f "$fiche" ] && cat "$fiche"
            done
            if [ -f app/output/elements.md ]; then
              cat app/output/elements.md
            fi
            if [ -f app/output/mesures_videos.md ]; then
              cat app/output/mesures_videos.md
            fi
            if [ -f app/output/controle_videos.md ]; then
              cat app/output/controle_videos.md
            fi
            if [ -f app/output/identite.md ]; then
              cat app/output/identite.md
            fi
            if [ -f app/output/timeline.json ]; then
              echo "### Timeline"
              echo
              echo '```json'
              cat app/output/timeline.json
              echo '```'
            fi
            if [ -f app/output/sous_titres.srt ]; then
              echo "### Sous-titres"
              echo
              echo '```'
              cat app/output/sous_titres.srt
              echo '```'
            fi
            echo
            echo "> Les fichiers sont dans l'artefact, en haut de cette page."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Déposer les fichiers en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.etape }}-${{ github.run_number }}
          path: prototype/app/output/
          if-no-files-found: warn

      - name: Enregistrer dans la branche
        if: always() && inputs.enregistrer
        run: |
          shopt -s nullglob
          # nullglob n'écarte que les motifs sans correspondance : un chemin
          # littéral absent resterait dans la liste et ferait échouer git add.
          candidats=(app/output/project.json app/output/elements.md
                     app/output/timeline.json app/output/sous_titres.srt
                     app/output/controle_videos.md app/output/identite.md
                     app/output/memoire/plans.json app/output/texte.json
                     app/output/manuel/*.md
                     app/output/mesures_videos.md
                     app/output/voix.md
                     app/output/manuel/voix_a_dire.md
                     app/output/shots/*/verdict.json
                     app/output/shots/*/image_analysis.json
                     app/output/shots/*/image_prompt.txt
                     app/output/shots/*/animation_prompt.txt
                     app/output/shots/*/voice.txt
                     app/output/shots/*/animation.json
                     app/output/shots/*/alignment.json
                     app/output/shots/*/video_analysis.json)
          fichiers=()
          for f in "${candidats[@]}"; do
            [ -f "$f" ] && fichiers+=("$f")
          done
          if [ ${#fichiers[@]} -eq 0 ]; then
            echo "Rien à enregistrer."
            exit 0
          fi
          echo "À enregistrer : ${fichiers[*]}"
          # -A pour que la suppression d'un plan en trop parte aussi : un run
          # plus court que le precedent laissait ses dossiers derriere lui.
          git add -A app/output/shots 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${fichiers[@]}"
          if git diff --cached --quiet; then
            echo "Identique au précédent, rien à enregistrer."
          else
            git commit -m "${{ inputs.etape }} : run ${{ github.run_number }}"
            # La branche peut avoir bougé pendant le run : on rejoue le
            # commit par-dessus au lieu de perdre le travail sur un rejet.
            git push origin "HEAD:${GITHUB_REF_NAME}" || {
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            }
          fi
