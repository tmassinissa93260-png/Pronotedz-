# ═══════════════════════════════════════════════════════════════════════
#  Prototype — sujet → OpenAI → storyboard validé → images → animations.
#
#  Onglet « Actions » → « Prototype — produire une vidéo » → « Run workflow ».
#  Le résultat attend en fin de page, dans les artefacts du run.
#
#  Trois étapes :
#
#    « produire »   → tout : storyboard validé, images fal.ai, et animations
#                     si le plafond « animations » est levé.
#                     ⚠️ fal.ai est payant, surtout la vidéo. Le plafond vaut
#                     0 par défaut : aucune dépense vidéo.
#
#    « storyboard » → le cerveau seul. Gratuit hors OpenAI. C'est l'étape à
#                     relancer pour juger la qualité de la narration.
#
#    « analyser »   → une image qui existe → ce qui y est réellement visible,
#                     puis le prompt d'animation adapté à CETTE image.
#
#  Le storyboard n'est jamais accepté sur parole : validator.py applique dix
#  vérifications, et ce qui échoue repart chez OpenAI pour correction.
# ═══════════════════════════════════════════════════════════════════════

name: Prototype — produire une vidéo

on:
  workflow_dispatch:
    inputs:
      etape:
        description: "Ce que je veux faire"
        required: true
        default: produire
        type: choice
        options:
          - produire     # TOUT automatique : OpenAI + fal.ai → images + vidéos
          - storyboard   # sujet → 4 plans + 4 prompts photo prêts à coller
          - analyser     # une image déjà générée → analyse + prompt d'animation
      sujet:
        description: "Le sujet (étape storyboard)"
        required: false
        default: "Fonctionnement d'une voiture électrique"
        type: string
      duree:
        description: "Durée visée, en secondes"
        required: false
        default: "16"
        type: string
      plans:
        description: "Nombre de plans"
        required: false
        default: "4"
        type: string
      plan:
        description: "Numéro du plan à analyser (étape analyser uniquement)"
        required: false
        default: "1"
        type: string
      image:
        description: >-
          L'image à analyser (étape analyser uniquement) : URL directe de
          l'image, ou chemin d'un fichier ajouté au dépôt. Ignoré ailleurs.
        required: false
        default: ""
        type: string
      animations:
        description: >-
          Combien de plans, AU PLUS, sont animés par fal.ai (étape produire).
          0 = images seulement, aucune dépense vidéo. C'est un plafond en
          PLANS, pas en dollars : le tarif n'est pas mesuré ici, relève ton
          solde fal.ai avant et après pour connaître le coût réel.
        required: false
        default: "0"
        type: string
      enregistrer:
        description: >-
          Enregistrer le storyboard dans la branche, pour que l'étape
          « analyser » puisse le relire plus tard.
        required: false
        default: true
        type: boolean

jobs:
  prompts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: prototype

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r app/requirements.txt

      - name: Vérifier qu'un cerveau est disponible
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY présente (${#OPENAI_API_KEY} caractères) → OpenAI."
          elif [ -n "$GROQ_API_KEY" ]; then
            echo "OPENAI_API_KEY absente, GROQ_API_KEY présente → bascule sur Groq."
            echo "Groq expose une API compatible OpenAI : le même code, une autre adresse."
            echo "::warning::Pour l'étape « produire », nomme un modèle vision Groq via"
            echo "la variable OPENAI_VISION_MODEL, sinon l'analyse d'image échouera."
          else
            echo "::error::Aucun cerveau : ni OPENAI_API_KEY ni GROQ_API_KEY."
            echo "Settings → Secrets and variables → Actions → New repository secret"
            echo "  OPENAI_API_KEY = sk-...   (OpenAI, payant, compte à créer)"
            echo "  ou GROQ_API_KEY = gsk_... (Groq, gratuit — tu l'as déjà)"
            exit 1
          fi

      - name: Tout produire avec fal.ai
        if: inputs.etape == 'produire'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          # Une variable de depot non definie vaut "" : ne la transmettre
          # que si elle a reellement une valeur.
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || '' }}
        run: |
          if [ -z "$FAL_KEY" ]; then
            echo "::error::Le secret FAL_KEY n'est pas défini."
            echo "Settings → Secrets and variables → Actions → New repository secret"
            echo "Nom : FAL_KEY   Valeur : ta clé fal.ai (fal.ai/dashboard/keys)"
            exit 1
          fi
          sans_video=""
          if [ "${{ inputs.animations }}" = "0" ]; then
            sans_video="--sans-video"
            echo "::notice::Plafond à 0 : images seulement, aucune dépense vidéo."
          fi
          python -m app.main produire \
            --subject "${{ inputs.sujet }}" \
            --duration "${{ inputs.duree }}" \
            --shots "${{ inputs.plans }}" \
            --max-animations "${{ inputs.animations }}" \
            $sans_video

      - name: Générer le storyboard et les prompts photo
        if: inputs.etape == 'storyboard'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m app.main storyboard \
            --subject "${{ inputs.sujet }}" \
            --duration "${{ inputs.duree }}" \
            --shots "${{ inputs.plans }}"

      - name: Analyser l'image puis écrire le prompt d'animation
        if: inputs.etape == 'analyser'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "${{ inputs.image }}" ]; then
            echo "::error::L'étape « analyser » a besoin du champ « image »."
            exit 1
          fi
          if [ ! -f app/output/project.json ]; then
            echo "::error::app/output/project.json absent de la branche."
            echo "Lance d'abord l'étape « storyboard » avec « enregistrer » coché."
            exit 1
          fi
          python -m app.main analyser \
            --shot "${{ inputs.plan }}" \
            --image "${{ inputs.image }}"

      - name: Récapitulatif lisible en fin de page
        if: always()
        run: |
          {
            echo "## Prototype — étape \`${{ inputs.etape }}\`"
            echo
            if [ -f app/output/project.json ]; then
              echo "### Storyboard validé"
              echo
              echo '```json'
              cat app/output/project.json
              echo '```'
            fi
            for f in app/output/shots/*/image.png; do
              [ -f "$f" ] || continue
              echo "- \`$f\` — $(du -h "$f" | cut -f1)"
            done
            for f in app/output/shots/*/video.mp4; do
              [ -f "$f" ] || continue
              echo "- \`$f\` — $(du -h "$f" | cut -f1)"
            done
            echo
            for f in app/output/shots/*/animation.json; do
              [ -f "$f" ] || continue
              echo "### $(basename "$(dirname "$f")") — animation"
              echo
              echo '```json'
              cat "$f"
              echo '```'
            done
            echo
            echo "> Les fichiers sont dans l'artefact, en haut de cette page."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Déposer les fichiers en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompts-${{ inputs.etape }}-${{ github.run_number }}
          path: prototype/app/output/
          if-no-files-found: warn

      - name: Enregistrer le storyboard dans la branche
        if: inputs.etape == 'storyboard' && inputs.enregistrer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/output/project.json
          if git diff --cached --quiet; then
            echo "Storyboard identique au précédent, rien à enregistrer."
          else
            git commit -m "prototype: storyboard « ${{ inputs.sujet }} »"
            git push
          fi
