# ═══════════════════════════════════════════════════════════════════════
#  PDZ 2 — produire un épisode sur les machines de GitHub.
#
#  Onglet « Actions » → « PDZ 2 — produire un épisode » → « Run workflow ».
#  Le MP4 attend en fin de page, dans les artefacts du run.
#
#  Ce workflow est le premier endroit où les adaptateurs distants sont
#  RÉELLEMENT appelés : ils ont été écrits dans un environnement où leurs
#  hôtes sont injoignables. Un échec ici est une information, pas une
#  surprise — et l'épisode se termine quand même, en local dégradé, parce
#  que chaque famille de fournisseurs garde son repli.
# ═══════════════════════════════════════════════════════════════════════

name: PDZ 2 — produire un épisode

on:
  workflow_dispatch:
    inputs:
      sujet:
        description: "Le sujet de l'épisode"
        required: true
        default: "Comment fonctionne une voiture électrique ?"
        type: string
      duree:
        description: "Durée visée, en secondes"
        required: true
        default: "45"
        type: string
      corpus:
        description: >-
          Dossier de documents sourcés. Le sujet doit correspondre à ce
          corpus : la recherche ne va pas sur le web, elle lit ces
          fichiers. Le corpus fourni parle de voiture électrique.
        required: true
        default: "pdz2/tests/fixtures/corpus"
        type: string
      distants:
        description: "Employer les fournisseurs distants (images, animation, voix, raisonneur)"
        required: true
        default: true
        type: boolean
      raisonneur:
        description: >-
          Qui décide le brief. « groq » est gratuit ; « anthropic » demande
          un crédit. Laisser vide prend le premier dont la clé est là.
        required: false
        default: groq
        type: choice
        options:
          - groq
          - anthropic
          - ""
      plans_animes:
        description: >-
          Combien de plans, AU PLUS, sont animés par le modèle vidéo payant
          (fal kling). Zéro = aucune dépense vidéo. C'est un plafond en
          PLANS, pas en dollars : le tarif de kling n'est pas mesuré et
          l'API de fal ne renvoie rien sur la facturation, donc un plafond
          en dollars serait une garantie fausse. Relever le solde du compte
          avant et après le run donne le coût réel.
        required: true
        default: "0"
        type: string


permissions:
  contents: read

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Outils système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[providers,dev]"

      - name: Ce que cette machine sait faire
        run: |
          pdz2 phases
          echo "────────────────────────────────────────────"
          pdz2 providers --probe
        env:
          FAL_KEY: ${{ inputs.distants && secrets.FAL_KEY || '' }}
          ELEVENLABS_API_KEY: ${{ inputs.distants && secrets.ELEVENLABS_API_KEY || '' }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ANTHROPIC_API_KEY: ${{ inputs.distants && secrets.ANTHROPIC_API_KEY || '' }}
          GROQ_API_KEY: ${{ inputs.distants && secrets.GROQ_API_KEY || '' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          PDZ2_REASONER: ${{ inputs.raisonneur }}

      - name: Le corpus existe et n'est pas vide
        run: |
          if [ ! -d "${{ inputs.corpus }}" ] || [ -z "$(ls -A "${{ inputs.corpus }}" 2>/dev/null)" ]; then
            echo "::error::corpus introuvable ou vide : ${{ inputs.corpus }}"
            echo "La recherche de PDZ 2 lit des documents sourcés, elle n'interroge"
            echo "aucun moteur de recherche. Déposer des fichiers .md avec un en-tête"
            echo "  ---"
            echo "  title: …"
            echo "  kind: documentation|paper|encyclopedia|…"
            echo "  url: …"
            echo "  authority: 0.0 à 1.0"
            echo "  ---"
            exit 1
          fi
          ls -la "${{ inputs.corpus }}"

      - name: Produire
        id: produire
        run: |
          set +e
          pdz2 create \
            --episode episode \
            --topic "${{ inputs.sujet }}" \
            --corpus "${{ inputs.corpus }}" \
            --duration "${{ inputs.duree }}" \
            --animated-shots "${{ inputs.plans_animes }}"
          code=$?
          set -e
          # 3 n'est pas une panne : c'est l'arrêt volontaire devant le brief,
          # quand aucun raisonneur n'est branché pour le décider. Le gabarit
          # est dans l'artefact ; le remplir et relancer avec --brief.
          if [ "$code" -eq 3 ]; then
            echo "::warning::la chaîne s'est arrêtée devant le brief de réalisation — gabarit dans l'artefact « episode-complet »"
            exit 0
          fi
          exit "$code"
        env:
          FAL_KEY: ${{ inputs.distants && secrets.FAL_KEY || '' }}
          ELEVENLABS_API_KEY: ${{ inputs.distants && secrets.ELEVENLABS_API_KEY || '' }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ANTHROPIC_API_KEY: ${{ inputs.distants && secrets.ANTHROPIC_API_KEY || '' }}
          GROQ_API_KEY: ${{ inputs.distants && secrets.GROQ_API_KEY || '' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          PDZ2_REASONER: ${{ inputs.raisonneur }}

      - name: Ce qui a été dit aux fournisseurs
        if: always()
        run: pdz2 prompts --episode episode --animation || true

      - name: Journal de production
        if: always()
        run: pdz2 journal --episode episode || true

      - name: La vidéo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-mp4
          path: episode/final.mp4
          if-no-files-found: warn

      - name: Le dossier complet — contrats, journal, mesures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-complet
          path: |
            episode/**
            !episode/renders/**/frames/**
          if-no-files-found: warn
          retention-days: 14
