# ═══════════════════════════════════════════════════════════════════════
#  Faire tourner Pronotedz SANS ordinateur.
#
#  Depuis ton téléphone : onglet « Actions » du dépôt → « Produire » →
#  « Run workflow ». Tu remplis le formulaire, GitHub fait le travail sur
#  ses machines, et la vidéo t'attend en fin de page.
#
#  Voir TELEPHONE.md pour la marche à suivre en images.
# ═══════════════════════════════════════════════════════════════════════

name: Produire

on:
  workflow_dispatch:
    inputs:
      quoi:
        description: "Ce que je veux faire"
        required: true
        default: episode
        type: choice
        options:
          - episode          # écrire, dire, illustrer, monter → un .mp4
          - reprendre        # finir un épisode interrompu, sans repayer
          - analyser         # mesurer une vidéo de référence (gratuit)
          - musique          # reconnaître la musique d'une vidéo
          - charte           # faire d'une vidéo un univers jouable
          - voix             # donner une voix à chaque personnage
          - resultats        # importer mes stats TikTok et voir ce qui marche
          - cles             # vérifier que mes clés marchent (gratuit)
      univers:
        description: "Univers (pour episode / voix), ou identifiant à créer (pour charte)"
        required: false
        default: fruit-island
      sujet:
        description: "Ce qui se passe dans l'épisode"
        required: false
        default: ""
      fichier:
        description: "Vidéo de référence, ou export CSV : chemin dans le dépôt, ou URL directe"
        required: false
        default: ""
      job:
        description: "Identifiant de l'épisode à reprendre (job_xxx)"
        required: false
        default: ""
      duree:
        description: "Durée visée, en secondes"
        required: false
        default: "45"
      forme:
        description: "Épouser la forme d'une vidéo déjà analysée (str_xxx, donné par « analyser »)"
        required: false
        default: ""
      profil:
        description: "Qualité et coût — « gratuit »/« hybride » n'utilisent pas Claude, demandent GROQ_API_KEY"
        required: false
        default: equilibre
        type: choice
        options: [economique, equilibre, premium, gratuit, hybride]
      budget:
        description: "Plafond de dépense pour CETTE vidéo, en euros (l'animation coûte ~0,23 €/plan)"
        required: false
        default: "0.60"

# Une seule production à la fois : la base SQLite est partagée d'un lancement
# à l'autre par le cache, et deux écritures simultanées la corrompraient.
concurrency:
  group: pronotedz-production
  cancel-in-progress: false

permissions:
  contents: write          # `charte` et `voix` écrivent dans univers/

jobs:
  produire:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ffmpeg fait tout le montage et toutes les mesures ; les polices
      # DejaVu servent aux sous-titres karaoké.
      - name: Installer ffmpeg et les polices
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-dejavu-extra

      - name: Installer Pronotedz
        run: pip install -e . --quiet

      # Le cache est ce qui rend l'opération économique : les images, les
      # voix et les sondes déjà payées sont réutilisées d'un lancement à
      # l'autre au lieu d'être refacturées.
      - name: Récupérer le cache et la base
        uses: actions/cache@v4
        with:
          path: |
            donnees/cache
            donnees/pronotedz.db
          key: pronotedz-donnees-${{ github.run_id }}
          restore-keys: pronotedz-donnees-

      - name: Récupérer le fichier d'entrée
        if: inputs.fichier != ''
        env:
          FICHIER: ${{ inputs.fichier }}
        run: |
          mkdir -p donnees/sources
          # Un export d'analytics est un CSV, une référence est une vidéo :
          # ffmpeg et le lecteur CSV ne pardonnent pas l'inversion.
          if [ "${{ inputs.quoi }}" = "resultats" ]; then
            DEST=donnees/sources/export.csv
          else
            DEST=donnees/sources/reference.mp4
          fi

          # Google Drive et Dropbox servent une PAGE (aperçu, écran de
          # confirmation) sur leurs liens de partage, pas le fichier. Sans
          # cette conversion, curl enregistre du HTML sous le nom .mp4 et
          # l'erreur ne sort que bien plus tard, sous la forme illisible
          # « moov atom not found ». Un lien direct classique passe tel quel.
          normaliser_url() {
            u="$1"
            case "$u" in
              *drive.google.com*|*drive.usercontent.google.com*)
                id=$(printf '%s' "$u" | sed -n 's#.*/file/d/\([^/?]*\).*#\1#p')
                [ -z "$id" ] && id=$(printf '%s' "$u" | sed -n 's#.*[?&]id=\([^&]*\).*#\1#p')
                if [ -n "$id" ]; then
                  printf 'https://drive.usercontent.google.com/download?id=%s&export=download&confirm=t' "$id"
                  return
                fi
                ;;
              *dropbox.com*)
                printf '%s' "$u" | sed -e 's/dl=0/dl=1/'
                return
                ;;
            esac
            printf '%s' "$u"
          }

          if [ -f "$FICHIER" ]; then
            cp "$FICHIER" "$DEST"
            echo "Fichier pris dans le dépôt : $FICHIER"
          else
            URL=$(normaliser_url "$FICHIER")
            [ "$URL" != "$FICHIER" ] && echo "Lien de partage converti en lien direct."
            curl -fsSL --max-time 300 -o "$DEST" "$URL"
            echo "Fichier téléchargé depuis l'URL fournie"
          fi
          ls -lh "$DEST"

          # Contrôler ce qu'on a VRAIMENT reçu. Un partage resté privé renvoie
          # une page de connexion avec un code 200 : sans ce garde-fou, la
          # panne se révèle plusieurs minutes plus tard, dans ffprobe.
          TYPE=$(file -b --mime-type "$DEST")
          echo "Type reçu : $TYPE"
          if [ "$DEST" = "donnees/sources/export.csv" ]; then
            ATTENDU=text
          else
            ATTENDU=media
          fi
          case "$ATTENDU:$TYPE" in
            media:video/*|media:audio/*|media:application/octet-stream) ;;
            text:text/*|text:application/csv) ;;
            *)
              echo "::error::Le lien n'a pas renvoyé le bon type de fichier ($TYPE)."
              echo "::error::Cause la plus fréquente : le partage n'est pas réglé sur"
              echo "::error::« Tous les utilisateurs disposant du lien » — le service"
              echo "::error::renvoie alors sa page de connexion à la place du fichier."
              exit 1
              ;;
          esac

          echo "ENTREE=$DEST" >> "$GITHUB_ENV"

      - name: Faire le travail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AUDD_API_KEY: ${{ secrets.AUDD_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROFIL: ${{ inputs.profil }}
          # Le plafond par vidéo est un garde-fou, pas un réglage de qualité :
          # il décide surtout combien de plans peuvent être animés. À 0,60 €
          # l'animation s'arrête à 2 plans, ce qui se voit à l'écran.
          BUDGET_MAX_PAR_VIDEO_EUR: ${{ inputs.budget }}
          # Les valeurs saisies passent par l'environnement, jamais par une
          # interpolation dans le script : un sujet contenant un guillemet ou
          # un point-virgule serait sinon exécuté comme une commande.
          UNIVERS: ${{ inputs.univers }}
          SUJET: ${{ inputs.sujet }}
          JOB: ${{ inputs.job }}
          DUREE: ${{ inputs.duree }}
          FORME: ${{ inputs.forme }}
        run: |
          set -o pipefail
          SORTIE=$(mktemp)

          case "${{ inputs.quoi }}" in
            cles)
              pdz cles | tee "$SORTIE"
              ;;
            episode)
              if [ -z "$SUJET" ]; then
                echo "::error::Il faut un sujet pour écrire un épisode."
                exit 1
              fi
              # `--forme` fait épouser à l'épisode le rythme mesuré sur une
              # vidéo de référence (durée du hook, cadence de coupe, positions
              # de relance). La forme vient d'un lancement « analyser »
              # précédent : elle vit dans la base, que le cache conserve.
              ARGS_FORME=()
              if [ -n "$FORME" ]; then
                ARGS_FORME=(--forme "$FORME")
              fi
              pdz episode "$UNIVERS" "$SUJET" \
                --duree "$DUREE" --profil "${{ inputs.profil }}" \
                "${ARGS_FORME[@]}" \
                | tee "$SORTIE"
              ;;
            reprendre)
              if [ -z "$JOB" ]; then
                echo "::error::Donne l'identifiant de l'épisode à reprendre."
                echo "::error::Il est écrit dans le résumé du lancement raté."
                exit 1
              fi
              pdz reprendre "$JOB" | tee "$SORTIE"
              ;;
            analyser)
              pdz analyser donnees/sources/reference.mp4 | tee "$SORTIE"
              ;;
            musique)
              pdz musique donnees/sources/reference.mp4 | tee "$SORTIE"
              ;;
            resultats)
              if [ -f donnees/sources/export.csv ]; then
                pdz resultats importer donnees/sources/export.csv | tee "$SORTIE"
              fi
              pdz resultats bilan | tee -a "$SORTIE"
              ;;
            charte)
              pdz charte donnees/sources/reference.mp4 \
                --id "$UNIVERS" --duree "$DUREE" | tee "$SORTIE"
              ;;
            voix)
              if [ -f donnees/sources/reference.mp4 ]; then
                pdz voix apparier "$UNIVERS" \
                  --source donnees/sources/reference.mp4 | tee "$SORTIE"
              else
                pdz voix apparier "$UNIVERS" | tee "$SORTIE"
              fi
              ;;
          esac

          # Le résumé s'affiche directement dans l'app GitHub : pas besoin
          # d'ouvrir les journaux pour savoir ce qui s'est passé.
          {
            echo "## ${{ inputs.quoi }}"
            echo '```'
            cat "$SORTIE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `charte` crée un univers, `voix` y écrit les voix retenues. Sans ce
      # renvoi, ce travail serait perdu à la fin du lancement.
      - name: Garder l'univers créé ou modifié
        if: inputs.quoi == 'charte' || inputs.quoi == 'voix'
        env:
          UNIVERS: ${{ inputs.univers }}
          QUOI: ${{ inputs.quoi }}
        run: |
          if [ -n "$(git status --porcelain univers/)" ]; then
            git config user.name "Pronotedz"
            git config user.email "noreply@github.com"
            git add univers/
            git commit -m "univers: $QUOI sur $UNIVERS"
            git push
            echo "Univers mis à jour et enregistré dans le dépôt." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Deux façons de récupérer la vidéo, parce qu'elles ne se valent pas
      # sur un téléphone. L'artefact arrive en ZIP, ce qui oblige à
      # décompresser avant de pouvoir regarder. La « release », elle, donne un
      # lien .mp4 direct qui se lit d'un doigt — et qui ne disparaît pas au
      # bout de 30 jours.
      - name: Publier la vidéo en lien direct
        if: inputs.quoi == 'episode' || inputs.quoi == 'reprendre'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          VIDEOS=(donnees/sorties/*.mp4)
          if [ ${#VIDEOS[@]} -eq 0 ]; then
            echo "Aucune vidéo produite." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TAG="episode-${{ github.run_number }}"
          gh release create "$TAG" "${VIDEOS[@]}" \
            --title "Épisode ${{ github.run_number }}" \
            --notes "Produit le $(date '+%d/%m/%Y à %H:%M'). Touche le fichier .mp4 pour le regarder." \
            || gh release upload "$TAG" "${VIDEOS[@]}" --clobber

          {
            echo "### 📹 Ta vidéo"
            for v in "${VIDEOS[@]}"; do
              echo "- [$(basename "$v")](${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$(basename "$v"))"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Récupérer la vidéo (copie en ZIP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            donnees/sorties/*.mp4
          if-no-files-found: ignore
          retention-days: 30

      - name: Combien ça a coûté
        if: always()
        run: |
          {
            echo "### Dépense"
            echo '```'
            pdz cout --jours 30 2>/dev/null || echo "pas de dépense enregistrée"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
