<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Pronotedz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="auth-page d-flex align-items-center justify-content-center">
  <div class="card auth-card shadow-sm">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <h1 class="h3 fw-bold text-primary mb-0">Pronotedz</h1>
        <p class="text-muted small">Espace numérique de l'établissement</p>
      </div>

      {% if form.errors %}
        <div class="alert alert-danger py-2">Identifiant ou mot de passe incorrect.</div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label for="id_username" class="form-label">Identifiant</label>
          <input type="text" name="username" class="form-control" id="id_username" autofocus required>
        </div>
        <div class="mb-3">
          <label for="id_password" class="form-label">Mot de passe</label>
          <input type="password" name="password" class="form-control" id="id_password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary w-100">Se connecter</button>
      </form>
    </div>
  </div>
</body>
</html>
