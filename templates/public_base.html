<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pronotedz{% endblock %}</title>
  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
  <header class="public-header">
    <div class="public-header-inner">
      <span class="app-brand-badge">🎓</span>
      <span class="fw-bold">{% block header_title %}Pronotedz{% endblock %}</span>
    </div>
  </header>
  <main class="public-main">
    {% if messages %}
      <div class="container" style="max-width: 720px;">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="public-footer">
    <span>Propulsé par Pronotedz</span>
  </footer>
</body>
</html>
