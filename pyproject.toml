[project]
name = "pronotedz"
version = "0.1.0"
description = "Agent perso de génération de vidéos courtes (TikTok / Reels / Shorts)"
requires-python = ">=3.11"

dependencies = [
    "typer>=0.12",              # ligne de commande
    "rich>=13.7",               # affichage terminal
    "httpx>=0.27",              # appels HTTP
    "pydantic>=2.7",            # validation
    "pydantic-settings>=2.3",   # config depuis .env
    "PyYAML>=6.0",              # prompts et modeles.yaml
    "jinja2>=3.1",              # rendu des prompts
    "jsonschema>=4.22",         # validation des sorties d'agents
    "fastapi>=0.111",           # page web de validation
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",              # analyse du son, de l'image et de la voix
    "Pillow>=10.3",             # préparation des images du montage
]

[project.optional-dependencies]
# Analyse de vidéos — installé seulement quand on attaque le parcours 2
analyse = [
    "scenedetect[opencv]>=0.6.4",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
pdz = "pdz.cli:app"
# PDZ 2 — reconstruction indépendante, voir pdz2/architecture/ADR-0001.
pdz2 = "pdz2.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdz", "pdz2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # `str, Enum` plutôt que `StrEnum` : les valeurs sont sérialisées en YAML
    # et relues par pydantic, et le code lit `.value` explicitement. Changer
    # de base modifierait le rendu de `str(x)` pour un gain de style nul.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Typer déclare les options en appelant typer.Option() dans les valeurs par
# défaut : c'est son API, pas un oubli.
"pdz/cli.py" = ["B008"]
# Les fabriques de test construisent volontairement des objets invalides.
"pdz2/tests/*" = ["B008"]
# Importer une fixture pytest pour s'en servir comme paramètre est l'idiome
# du framework, pas une redéfinition : `from tests.x import atelier` puis
# `def test_y(atelier)`. Le `# noqa: F401` posé sur la ligne d'import ne peut
# pas couvrir les F811 signalés, eux, sur chaque paramètre.
"tests/*" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests", "pdz2/tests"]
